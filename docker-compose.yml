version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: tradepilot_postgres
    restart: always
    environment:
      POSTGRES_USER: tradepilot
      POSTGRES_PASSWORD: tradepilot_password
      POSTGRES_DB: tradepilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradepilot -d tradepilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: tradepilot_api
    restart: always
    environment:
      DATABASE_URL: postgresql://tradepilot:tradepilot_password@db:5432/tradepilot_db
      SECRET_KEY: ${SECRET_KEY:-tradepilot-production-secret-min32characters-key}
      TRADING_MODE: PAPER
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_PAPER: "true"
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_URL: https://data.alpaca.markets
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    container_name: tradepilot_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://tradepilot:tradepilot_password@db:5432/tradepilot_db
      SECRET_KEY: ${SECRET_KEY:-tradepilot-production-secret-min32characters-key}
      TRADING_MODE: PAPER
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_PAPER: "true"
      ALPACA_BASE_URL: https://paper-api.alpaca.markets
      ALPACA_DATA_URL: https://data.alpaca.markets
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: tradepilot_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
